# ============================================================
#  AAJKATEL.IN  --  netlify.toml
# ============================================================

[build]
  publish = "."
  functions = "api"

# Security & performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://pagead2.googlesyndication.com https://partner.googleadservices.com https://tpc.googlesyndication.com https://www.googletagservices.com https://adservice.google.com https://adservice.google.co.in;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com;
      font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net;
      img-src 'self' data: https:;
      connect-src 'self' https://nominatim.openstreetmap.org https://api.collectapi.com https://formspree.io https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net https://adservice.google.com https://adservice.google.co.in;
      frame-src https://googleads.g.doubleclick.net https://tpc.googlesyndication.com;
      frame-ancestors 'none';
    """

# Cache static assets aggressively
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ads.txt must not be cached — AdSense crawlers need the freshest version
[[headers]]
  for = "/ads.txt"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "text/plain"

# Redirect www to non-www
[[redirects]]
  from = "https://www.aajkatel.in/*"
  to   = "https://aajkatel.in/:splat"
  status = 301
  force = true

# Function redirects
[[redirects]]
  from = "/.netlify/functions/get-prices"
  to   = "/.netlify/functions/get-prices"
  status = 200

[[redirects]]
  from = "/.netlify/functions/report-price"
  to   = "/.netlify/functions/report-price"
  status = 200
